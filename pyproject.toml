[tool.poetry]
name = "music-bot"
version = "0.1.0"
description = "Telegram music bot powered by Yandex Music"
authors = ["Sherif Ragimov <sh.ragimov@idaproject.com>"]

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = ">=1.0.0"
aiogram = "^3.20.0.post0"
yandex-music = {version = "^3.0.0", extras = ["async"]}
tenacity = "^9.1.2"
redis = "^6.2.0"
loguru = "^0.7.3"
asyncpg = "^0.30.0"
aiohttp = "^3.11.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.25"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
