# Изолированный прогон тестов: чистые PostgreSQL (tmpfs) и Redis, без именованных томов.
# Запуск: make test   или   bash scripts/run-tests.sh

name: music-bot-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: mus_db_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d mus_db_test"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:8.0-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: mus_db_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: test-token-for-pytest
      YAM_TOKEN: ""
      BOT_LINK: https://t.me/example_bot
      ADMIN_CHAT_ID: "1"
      GRAMADS_ON: "False"
    volumes:
      - .:/app
    command:
      - /app/scripts/wait-for-services.sh
      - pytest
      - tests/
      - -v
